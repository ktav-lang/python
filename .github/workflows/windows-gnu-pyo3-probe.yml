name: Windows GNU PyO3 compatibility probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REF: 566bbfce6c6b48387d7a0a089939a26744013dea

jobs:
  compatibility:
    name: Genuine PyO3 GNU / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
            python-arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            python-arch: arm64
    env:
      GNU_TARGET: ${{ matrix.target }}
      ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the reviewed original Python lock
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          raw = Path('ci/windows-gnu-probe.lock').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '657c314ced9fea78d2868a6ba42d410bab8db587a80c130ff7866e00bb9a57b7':
              raise SystemExit('reviewed original Python lock differs')
          (Path(os.environ['RUNNER_TEMP']) / 'python-gnu-probe.lock').write_bytes(raw)
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}
      - name: Bind original Python source and dependency identities
        shell: python
        run: |
          import hashlib
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['SOURCE_REF']:
              raise SystemExit('unexpected original Python source')
          raw = (Path(os.environ['RUNNER_TEMP']) / 'python-gnu-probe.lock').read_bytes()
          Path('Cargo.lock').write_bytes(raw)
          packages = tomllib.loads(raw.decode('utf-8'))['package']
          expected = {'ktav': ('0.8.1', '7140dfe2fa6c320e74768cd6a637828c2d26f81746254f4fcd805f3993bd3fd5'), 'pyo3': ('0.28.3', '91fd8e38a3b50ed1167fb981cd6fd60147e091784c427b8f7183a7ee32c31c12'), 'python3-dll-a': ('0.2.15', 'd80ba7540edb18890d444c5aa8e1f1f99b1bdf26fb26ae383135325f4a36042b')}
          for name, (version, checksum) in expected.items():
              found = [item for item in packages if item['name'] == name]
              if len(found) != 1 or found[0]['version'] != version or found[0]['checksum'] != checksum or found[0]['source'] != 'registry+https://github.com/rust-lang/crates.io-index':
                  raise SystemExit('original reviewed dependency differs: ' + name)
          subprocess.run(['git', 'diff', '--exit-code', '--', 'Cargo.toml', 'pyproject.toml', 'src', 'python', 'tests', 'spec'], check=True)
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Install exact SDK and bind real matching-CPU CPython import libraries
        shell: python
        run: |
          """Настроить reviewed SDK и genuine CPython import libraries для CI probe."""

          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import platform
          import stat
          import subprocess
          import sys
          import urllib.request
          import zipfile

          TARGETS = {'x86_64-pc-windows-gnullvm': ('x64', 'x86_64-w64-mingw32-clang.exe', 'IMAGE_FILE_MACHINE_AMD64'), 'aarch64-pc-windows-gnullvm': ('arm64', 'aarch64-w64-mingw32-clang.exe', 'IMAGE_FILE_MACHINE_ARM64')}
          target = os.environ['GNU_TARGET']
          arch, compiler_name, machine = TARGETS[target]
          actual = {'amd64': 'x64', 'x86_64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}.get(platform.machine().lower())
          if actual != arch or os.environ['ACTUAL_RUNNER_ARCH'].lower() != arch:
              raise ValueError('genuine matching runner and CPython architecture required')
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'python-gnu-probe-evidence'
          evidence.mkdir()
          folder = root / 'python-gnu-probe-sdk'
          folder.mkdir()
          archive_path = folder / 'sdk.zip'
          url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          checksum = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(url, timeout=120) as response, archive_path.open('xb') as output:
              while chunk := response.read(1024 * 1024):
                  total += len(chunk)
                  if total > 256 * 1024 * 1024:
                      raise ValueError('SDK archive bound')
                  checksum.update(chunk)
                  output.write(chunk)
          if checksum.hexdigest() != 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd':
              raise ValueError('reviewed LLVM MinGW SDK archive differs')
          with zipfile.ZipFile(archive_path) as archive:
              seen = set()
              total = 0
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  total += item.file_size
                  if path.is_absolute() or '..' in path.parts or chr(92) in item.filename or ':' in item.filename or item.filename.casefold() in seen or stat.S_IFMT(item.external_attr >> 16) == stat.S_IFLNK or item.file_size > 512 * 1024 * 1024 or total > 2 * 1024 * 1024 * 1024 or len(seen) > 16384:
                      raise ValueError('unsafe or oversized reviewed SDK member')
                  seen.add(item.filename.casefold())
              archive.extractall(folder)
          sdk = folder / 'llvm-mingw-20261020-ucrt-x86_64'
          compiler = sdk / 'bin' / compiler_name
          lib_dir = Path(sys.base_prefix) / 'libs'
          import_library = lib_dir / 'python3.lib'
          if not compiler.is_file() or not import_library.is_file() or import_library.is_symlink() or import_library.stat().st_size > 16 * 1024 * 1024:
              raise ValueError('real SDK compiler and installed CPython stable-ABI import library required')
          headers = subprocess.check_output([str(sdk / 'bin/llvm-readobj.exe'), '--file-headers', str(import_library)])
          if machine.encode() not in headers or any(value.encode() in headers for value in ['IMAGE_FILE_MACHINE_AMD64', 'IMAGE_FILE_MACHINE_ARM64', 'IMAGE_FILE_MACHINE_I386'] if value != machine):
              raise ValueError('actual CPython import library CPU differs')
          (evidence / 'cpython-import-library-headers.txt').write_bytes(headers)
          (evidence / 'compiler-version.txt').write_bytes(subprocess.check_output([str(compiler), '--version']))
          record = {'target': target, 'runner_arch': arch, 'python_version': platform.python_version(), 'python_machine': platform.machine(), 'python_import_library': import_library.name, 'python_import_library_sha256': hashlib.sha256(import_library.read_bytes()).hexdigest(), 'sdk_archive_sha256': checksum.hexdigest(), 'source_ref': os.environ['SOURCE_REF'], 'tooling_ref': os.environ['GITHUB_SHA'], 'scope': 'Compatibility probe using real installed CPython import libraries; no target spoof, generated fake DLL/library, native distribution or licence clearance.'}
          (evidence / 'source-provenance.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          key = 'CARGO_TARGET_' + target.upper().replace('-', '_') + '_LINKER'
          flags = ['-C', 'target-feature=+crt-static', '-C', 'link-arg=-Wl,-Map,' + (evidence / 'native-link.map').as_posix(), '-C', 'link-arg=-Wl,--reproduce=' + (root / 'python-gnu-probe-link.tar').as_posix()]
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              for name, value in [(key, str(compiler)), ('CARGO_ENCODED_RUSTFLAGS', chr(31).join(flags)), ('LLVM_MINGW_CANDIDATE', str(sdk)), ('PYO3_CROSS_LIB_DIR', str(lib_dir)), ('PYO3_CROSS_PYTHON_VERSION', platform.python_version().rsplit('.', 1)[0])]:
                  output.write(name + '=' + value + '\n')
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              output.write(str(sdk / 'bin') + '\n')
      - name: Build original Python stable-ABI wheel for the genuine GNU target
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python
          rust-toolchain: '1.99.1'
      - name: Inspect actual PE and run unchanged original native Python tests
        shell: python
        run: |
          """Проверить actual GNU wheel и установленный native Python backend в CI."""

          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import struct
          import subprocess
          import sys
          import tarfile
          import xml.etree.ElementTree as ET
          import zipfile

          target = os.environ['GNU_TARGET']
          arm = target.startswith('aarch64-')
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'python-gnu-probe-evidence'
          sdk = Path(os.environ['LLVM_MINGW_CANDIDATE'])
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1 or ('-cp39-abi3-win_arm64.whl' if arm else '-cp39-abi3-win_amd64.whl') not in wheels[0].name:
              raise ValueError('one genuine 0.8.1 Windows stable-ABI wheel required')
          wheel = wheels[0]
          if not wheel.name.startswith('ktav-0.8.1-') or wheel.stat().st_size > 128 * 1024 * 1024:
              raise ValueError('bounded original-version compatibility wheel required')
          with zipfile.ZipFile(wheel) as archive:
              native = [name for name in archive.namelist() if name.startswith('ktav/_core') and name.endswith('.pyd')]
              if len(native) != 1:
                  raise ValueError('one real PyO3 extension required')
              raw = archive.read(native[0])
          pe = int.from_bytes(raw[60:64], 'little')
          if len(raw) > 128 * 1024 * 1024 or raw[:2] != b'MZ' or raw[pe:pe + 4] != b'PE\0\0' or struct.unpack_from('<H', raw, pe + 4)[0] != (0xAA64 if arm else 0x8664):
              raise ValueError('actual Python extension CPU differs')
          module = root / 'python-gnu-actual-core.pyd'
          module.write_bytes(raw)
          headers = subprocess.check_output([str(sdk / 'bin/llvm-readobj.exe'), '--file-headers', '--coff-imports', '--coff-exports', str(module)])
          (evidence / 'native-pe-inputs.txt').write_bytes(headers)
          imports = [name.decode('ascii').lower() for name in re.findall(rb'^\s*Name: ([^\r\n]+[.]dll)\s*$', headers, re.M | re.I)]
          if 'python3.dll' not in imports or any(any(token in name for token in ['vcruntime', 'msvcp', 'libgcc', 'libstdc++', 'libunwind']) for name in imports) or len(re.findall(rb'^\s*Name: PyInit__core\s*$', headers, re.M)) != 1:
              raise ValueError('genuine stable-ABI Python import/export boundary differs')
          reproduction = root / 'python-gnu-probe-link.tar'
          if not reproduction.is_file() or reproduction.stat().st_size > 512 * 1024 * 1024:
              raise ValueError('actual linker reproduction required')
          inputs = []
          seen = set()
          total = 0
          with tarfile.open(reproduction, mode='r:') as archive:
              for item in archive:
                  from pathlib import PurePosixPath
                  path = PurePosixPath(item.name)
                  if path.is_absolute() or '..' in path.parts or chr(92) in item.name or item.name in seen or item.issym() or item.islnk():
                      raise ValueError('unsafe linker input inventory')
                  seen.add(item.name)
                  if item.isdir():
                      continue
                  total += item.size
                  if not item.isfile() or item.size > 128 * 1024 * 1024 or total > 512 * 1024 * 1024 or len(seen) > 8192:
                      raise ValueError('linker input bounds')
                  source = archive.extractfile(item)
                  checksum = hashlib.sha256()
                  size = 0
                  while chunk := source.read(1024 * 1024):
                      size += len(chunk)
                      checksum.update(chunk)
                  if size != item.size:
                      raise ValueError('truncated actual linker input')
                  inputs.append({'path': item.name, 'bytes': size, 'sha256': checksum.hexdigest()})
          (evidence / 'link-input-fingerprints.json').write_text(json.dumps(inputs, indent=2) + '\n', encoding='utf-8')
          (evidence / 'rustc.txt').write_bytes(subprocess.check_output(['rustc', '--version', '--verbose']))
          shutil.copyfile('Cargo.lock', evidence / 'Cargo.lock')
          if hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest() != '657c314ced9fea78d2868a6ba42d410bab8db587a80c130ff7866e00bb9a57b7':
              raise ValueError('compatibility build changed original reviewed lock')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-index', '--no-deps', str(wheel)], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'pytest>=7.0', 'pytest-cov>=4.0'], check=True)
          environment = dict(os.environ)
          for name in ['PYTHONPATH', 'PYO3_CROSS_LIB_DIR', 'PYO3_CROSS_PYTHON_VERSION', 'CARGO_TARGET_DIR']:
              environment.pop(name, None)
          path_key = next(name for name in environment if name.upper() == 'PATH')
          environment[path_key] = os.pathsep.join(part for part in environment[path_key].split(os.pathsep) if part and not any(value in part.lower() for value in ['.cargo', '.rustup', 'llvm-mingw']))
          environment['KTAV_REQUIRE_NATIVE'] = '1'
          environment['EXPECTED_NATIVE_SHA256'] = hashlib.sha256(raw).hexdigest()
          preflight = 'import hashlib,importlib.metadata,json,os,pathlib,ktav,ktav._core; p=pathlib.Path(ktav._core.__file__).resolve(); d=importlib.metadata.distribution("ktav"); assert d.version=="0.8.1"; assert any(pathlib.Path(d.locate_file(f)).resolve()==p for f in d.files); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["EXPECTED_NATIVE_SHA256"]; assert ktav.loads("answer: 42")=={"answer":42}; print(json.dumps({"installed_native":str(p),"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}))'
          result = subprocess.run([sys.executable, '-I', '-c', preflight], env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True)
          (evidence / 'installed-native-preflight.txt').write_bytes(result.stdout + result.stderr)
          result = subprocess.run([sys.executable, '-I', '-m', 'pytest', 'tests', '-q', '--junitxml=' + str(evidence / 'pytest.xml')], env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          (evidence / 'consumer-stdout.txt').write_bytes(result.stdout)
          (evidence / 'consumer-stderr.txt').write_bytes(result.stderr)
          sys.stdout.buffer.write(result.stdout)
          sys.stderr.buffer.write(result.stderr)
          if result.returncode:
              raise ValueError('unchanged original Python tests failed against actual installed GNU extension')
          suites = ET.parse(evidence / 'pytest.xml').getroot()
          cases = suites.findall('.//testcase')
          conformance = [case for case in cases if 'test_conformance' in case.attrib.get('classname', '')]
          if not conformance or any(case.find(tag) is not None for case in conformance for tag in ['failure', 'error', 'skipped']):
              raise ValueError('complete original native conformance tests must execute without skips')
          subprocess.run(['git', 'diff', '--exit-code', '--', 'Cargo.toml', 'pyproject.toml', 'src', 'python', 'tests', 'spec'], check=True)
          report = {'target': target, 'source_ref': os.environ['SOURCE_REF'], 'binary_sha256': hashlib.sha256(raw).hexdigest(), 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'imports': imports, 'test_cases': len(cases), 'conformance_cases': len(conformance), 'rust_and_sdk_paths_removed': True, 'wheel_and_native_uploaded': False, 'scope': 'Genuine same-CPU original 0.8.1 PyO3 GNU compatibility probe only. No complete runtime-grant/resource acceptance, production integration, publication or historical repair.'}
          (evidence / 'compatibility-verification.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
      - name: Upload inert compatibility diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-gnu-compatibility-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/python-gnu-probe-evidence/*.json
            ${{ runner.temp }}/python-gnu-probe-evidence/*.txt
            ${{ runner.temp }}/python-gnu-probe-evidence/*.map
            ${{ runner.temp }}/python-gnu-probe-evidence/*.lock
            ${{ runner.temp }}/python-gnu-probe-evidence/*.xml
          if-no-files-found: warn
