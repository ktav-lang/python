name: Musllinux runtime evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  static-libgcc:
    name: Musllinux static libgcc (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Cargo dependencies
        run: cargo generate-lockfile
      - name: Build musllinux wheel with static libgcc
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --locked
          manylinux: musllinux_1_2
          before-script-linux: |
            archive="$("${TARGET_CC:?}" -print-file-name=libgcc_eh.a)"
            test -f "$archive"
            mkdir -p probe
            {
              "${TARGET_CC}" --version
              "${TARGET_CC}" -v 2>&1
              sha256sum "$archive"
              "${TARGET_AR:?}" t "$archive"
            } > probe/libgcc-evidence.txt
            cat > /tmp/ktav-static-unwind-linker <<'SH'
            #!/usr/bin/env bash
            set -euo pipefail
            args=()
            replaced=0
            for arg in "$@"; do
              if [[ "$arg" == -lgcc_s ]]; then
                args+=("-Wl,-Bstatic" "-lgcc_eh" "-Wl,-Bdynamic")
                replaced=1
              else
                args+=("$arg")
              fi
            done
            if [[ "$replaced" != 1 ]]; then
              printf '%s\n' 'expected -lgcc_s in target link' >&2
              exit 1
            fi
            exec "${TARGET_CC:?}" -static-libgcc "${args[@]}"
            SH
            chmod +x /tmp/ktav-static-unwind-linker
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/ktav-static-unwind-linker
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/ktav-static-unwind-linker
            cargo metadata --locked --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); v=[p["version"] for p in d["packages"] if p["name"]=="pyo3"]; assert v==["0.28.3"],v'
            cargo generate-lockfile --manifest-path tests/fixtures/unwind-probe/Cargo.toml
            RUSTFLAGS="-C target-feature=-crt-static" cargo build --locked --release --manifest-path tests/fixtures/unwind-probe/Cargo.toml --target "${RUST_MUSL_CROSS_TARGET:?}"
            mkdir -p probe
            cp "tests/fixtures/unwind-probe/target/${RUST_MUSL_CROSS_TARGET}/release/lib_unwind_probe.so" probe/_unwind_probe.so
            cp tests/fixtures/unwind-probe/Cargo.lock probe/Cargo.lock
      - name: Verify wheel native payload
        shell: python
        run: |
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one wheel, got {wheels!r}')
          with zipfile.ZipFile(wheels[0]) as wheel:
              native = [name for name in wheel.namelist()
                        if re.search(r'\.so(?:\.\d+)*$', name)]
              if native != ['ktav/_core.abi3.so']:
                  raise SystemExit(f'unexpected wheel native payload: {native!r}')
              module = Path(os.environ['RUNNER_TEMP']) / 'ktav-native.so'
              module.write_bytes(wheel.read(native[0]))
          for binary, expected in (
              (module, 'PyInit__core'),
              (Path('probe/_unwind_probe.so'), 'PyInit__unwind_probe'),
          ):
              dynamic = subprocess.check_output(['readelf', '-d', str(binary)], text=True)
              print(f'{binary}:\n{dynamic}')
              if re.search(r'Shared library: \[libgcc_s(?:\.|-)', dynamic):
                  raise SystemExit(f'{binary} still dynamically requires libgcc_s')
              symbols = subprocess.check_output(
                  ['readelf', '--dyn-syms', '--wide', str(binary)], text=True
              )
              exports = [parts[7] for line in symbols.splitlines() if len(parts := line.split()) >= 8
                         and parts[4] in ('GLOBAL', 'WEAK') and parts[5] in ('DEFAULT', 'PROTECTED')
                         and parts[6] != 'UND']
              if exports != [expected]:
                  raise SystemExit(f'{binary}: unexpected exported symbols: {exports!r}')
      - uses: actions/upload-artifact@v4
        with:
          name: musllinux-static-libgcc-${{ matrix.target }}
          path: |
            dist/*.whl
            Cargo.lock
            probe/_unwind_probe.so
            probe/Cargo.lock
            probe/libgcc-evidence.txt
          if-no-files-found: error

  musllinux-runtime:
    name: Musllinux runtime and panic (${{ matrix.target }})
    needs: static-libgcc
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/musllinux_1_2_x86_64
          - target: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/musllinux_1_2_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: musllinux-static-libgcc-${{ matrix.target }}
          path: payload
      - name: Download pure Python test dependencies
        run: 'python -m pip download --only-binary=:all: --dest payload/testdeps pytest'
      - name: Verify native parsing and PyO3 panic conversion
        shell: bash
        env:
          MUSL_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/spec"
          cp -R tests "$stage/tests"
          cp -R spec/versions "$stage/spec/versions"
          cp pyproject.toml "$stage/pyproject.toml"
          docker pull "$MUSL_IMAGE"
          docker run --rm -i --network none \
            --mount "type=bind,source=$PWD/payload,target=/payload,readonly" \
            --mount "type=bind,source=$stage,target=/work,readonly" \
            --workdir /work "$MUSL_IMAGE" /bin/sh -ec '
              /opt/python/cp312-cp312/bin/python -m pip install --no-index --find-links=/payload/testdeps pytest
              /opt/python/cp312-cp312/bin/python -m pip install --no-index --no-deps /payload/dist/*.whl
              PYTHONPATH=/payload/probe /opt/python/cp312-cp312/bin/python -
              KTAV_REQUIRE_NATIVE=1 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/payload/probe \
                /opt/python/cp312-cp312/bin/python -m pytest -p no:cacheprovider -q \
                tests/test_conformance.py tests/edit tests/parse tests/serialize tests/roundtrip
            ' <<'PY'
          import _unwind_probe
          import ktav
          import ktav._core

          for _ in range(2):
              try:
                  _unwind_probe.panic_probe()
              except BaseException as exc:
                  if type(exc).__name__ != 'PanicException' or str(exc) != 'musllinux unwind probe':
                      raise
              else:
                  raise AssertionError('Rust panic was not converted to PanicException')
              if ktav.loads('answer: 42') != {'answer': 42}:
                  raise AssertionError('native parser returned an unexpected value')
          PY
